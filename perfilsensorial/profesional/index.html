<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Sentio | Panel profesional</title>
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="referrer" content="no-referrer" />
<link rel="icon" type="image/png" href="../../assets/logo/sentio-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../styles.css?v=20261006" />
</head>
<body>

<header class="app-header">
  <div class="brand">
    <img src="../../assets/logo/sentio-icon.png" alt="Sentio" class="logo" />
    <div>
      <h1>Panel profesional</h1>
      <div class="subtitle">Sentio · Perfiles sensoriales</div>
    </div>
  </div>
  <div class="header-actions" id="header-actions" hidden>
    <span id="user-email" class="subtitle" style="align-self:center; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></span>
    <button class="btn btn-sm btn-secondary" id="btn-logout" type="button">Cerrar sesión</button>
  </div>
</header>

<main id="panel" class="panel-main"></main>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modal-overlay" style="display:none">
  <div class="modal-box">
    <h3></h3>
    <p></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modal-cancel" type="button">Cancelar</button>
      <button class="btn btn-danger" id="modal-confirm" type="button">Confirmar</button>
    </div>
  </div>
</div>

<script src="../vendor/supabase.min.js"></script>
<script src="../shared/config.js?v=20261006"></script>
<script src="../shared/api.js?v=20261006"></script>
<script src="panel.js?v=20261006"></script>
</body>
</html>
